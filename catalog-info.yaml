apiVersion: backstage.io/v1alpha1
kind: System
metadata:
  name: harmonix
  title: Harmonix
  description: Unified system to setup & manage Zebra Hardware Devices
spec:
  type: product
  owner: group:harmonix
---
apiVersion: backstage.io/v1alpha1
kind: Component
metadata:
  name: hal
  title: Harmonix Adapter Layer
  description: A unified interface for front-ends to interact with the Harmonix System
  links:
    - url: https://harmonix-dev.zebra.com/
      title: Harmonix - Dev
      icon: dashboard
    - url: https://harmonix-dev.zebra.com/
      title: Harmonix - Stage
      icon: dashboard
    - url: https://harmonix.zebra.com/
      title: Harmonix - Production
      icon: dashboard
  annotations:
    github.com/project-slug: zebratechnologies/harmonix-app
    # backstage.io/techdocs-ref: dir:.
    # backstage.io/kubernetes-id: sample-service
    # backstage.io/kubernetes-label-selector: 'app.kubernetes.io/name=sample-service'
    # backstage.io/code-coverage: enabled
spec:
  system: harmonix
  type: service
  owner: group:Harmonix-HAL
  lifecycle: experimental
  providesApis:
    - meta-api
    - device-api
---
apiVersion: backstage.io/v1alpha1
kind: API
metadata:
  name: meta-api
  description: Retrieve details about the deployed Harmonix Services
spec:
  type: openapi
  lifecycle: experimental
  system: harmonix
  owner: group:Harmonix-HAL
  definition:
    $text: https://github.com/zebratechnologies/harmonix-app/blob/develop/src/main/resources/openapi/meta.yml
---
apiVersion: backstage.io/v1alpha1
kind: API
metadata:
  name: device-api
  description: List and manage devices in the Harmonix System
spec:
  type: openapi
  lifecycle: experimental
  system: harmonix
  owner: group:Harmonix-HAL
  definition:
    $text: https://github.com/zebratechnologies/harmonix-app/blob/develop/src/main/resources/openapi/device.yml



